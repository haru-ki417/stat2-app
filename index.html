<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>統計検定2級 スマホ演習</title>
<meta name="theme-color" content="#2f5d8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="統計2級">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e1dc;
  --accent:#2f5d8a;--accent-soft:#e6eef6;--ok:#2e7d4f;--ok-soft:#e5f3ea;--ng:#b3372f;--ng-soft:#f8e7e5;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161618;--card:#222226;--ink:#ececef;--sub:#9a9aa2;--line:#34343a;
  --accent:#7fb0de;--accent-soft:#25313d;--ok:#6cc58f;--ok-soft:#1f3328;--ng:#ec8279;--ng-soft:#3a2321;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:20px;margin:6px 0 2px}
.lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px;font-weight:600}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.tab.on{color:#111}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.big{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:700;background:var(--accent);color:#fff;margin-bottom:8px}
@media (prefers-color-scheme:dark){.big{color:#111}}
.big.sec{background:var(--accent-soft);color:var(--accent)}
.big:disabled{opacity:.4}
.field{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;margin-bottom:8px;font-size:15px}
.field small{color:var(--sub);font-size:12px;display:block}
.pct{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;margin-left:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:6px}
.qtext{font-size:16.5px;margin:4px 0 14px}
.choice{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15.5px;line-height:1.5}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{color:var(--ink)}
.exp{border-radius:12px;padding:12px 14px;margin:6px 0 12px;font-size:15px}
.exp.ok{background:var(--ok-soft)}.exp.ng{background:var(--ng-soft)}
.exp b.v{display:block;margin-bottom:4px}
.exp.ok b.v{color:var(--ok)}.exp.ng b.v{color:var(--ng)}
.row{display:flex;gap:8px}.row .big{flex:1}
.small{color:var(--sub);font-size:12.5px}
.f h3{font-size:15px;margin:0 0 8px;color:var(--accent)}
.f p{margin:0 0 8px;font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:center}
.score{font-size:40px;font-weight:800;text-align:center;margin:8px 0 0}
.link{background:none;border:none;color:var(--accent);font-size:14px;padding:6px 0;text-decoration:underline}
sub,sup{font-size:.72em}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.fname{font-size:15px;font-weight:600;margin-bottom:8px}.fname small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.fbtn{flex:1;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;border:none;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:600}
.fbtn b{font-size:12.5px;margin-left:6px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>統計検定2級 スマホ演習</h1>
  <p class="lead">知識問題と、数値が毎回変わる計算ドリル。分野別にも解けます。成績はこのスマホの中だけに保存され、オフラインでも使えます。</p>
  <div class="tabs">
    <button class="tab on" data-v="home">問題</button>
    <button class="tab" data-v="formula">公式・数表</button>
  </div>
  <div id="home"></div>
  <div id="quiz" class="hide"></div>
  <div id="formula" class="hide"></div>
</div>

<script>
const FIELDS=[
 {id:"desc",name:"データの記述",sub:"代表値・散布度・相関・回帰直線"},
 {id:"coll",name:"データの収集",sub:"標本調査・実験計画"},
 {id:"prob",name:"確率",sub:"条件付き確率・ベイズ・独立"},
 {id:"dist",name:"確率分布",sub:"二項・ポアソン・正規・指数など"},
 {id:"samp",name:"標本分布",sub:"中心極限定理・t・χ²・F"},
 {id:"est",name:"推定",sub:"不偏性・信頼区間"},
 {id:"test",name:"仮説検定",sub:"z・t・比率・χ²・誤りと検出力"},
 {id:"reg",name:"回帰分析",sub:"決定係数・t値・重回帰"},
 {id:"anova",name:"分散分析・時系列",sub:"一元配置・移動平均・指数"}
];
// a = 正解の選択肢の番号(0始まり)。選択肢は表示時にシャッフル
const Q=[
// ---- データの記述 ----
{f:"desc",q:"データ 2, 4, 4, 5, 7, 8 の中央値は？",c:["4","4.5","5","6"],a:1,e:"データ数が偶数(6個)なので、中央の2つ(3番目の4と4番目の5)の平均をとって 4.5。"},
{f:"desc",q:"データ 2, 4, 4, 5, 7, 8 の標準偏差（nで割る定義）は？",c:["2","4","√4.8 ≈ 2.19","1.5"],a:0,e:"平均 = 30/6 = 5。偏差²は 9,1,1,0,4,9 で合計24。分散 = 24/6 = 4、標準偏差 = 2。n−1で割ると 4.8 になるので、どちらの定義か必ず確認。"},
{f:"desc",q:"箱ひげ図で第1四分位数 Q<sub>1</sub>=20、第3四分位数 Q<sub>3</sub>=32 のとき、「Q<sub>3</sub>+1.5×IQR を超える値を外れ値」とする基準で外れ値になるのは？",c:["52","48","45","40"],a:0,e:"IQR = 32−20 = 12。上側の境界 = 32 + 1.5×12 = 50。50を超えるのは 52 だけ。"},
{f:"desc",q:"A：平均50・標準偏差10、B：平均200・標準偏差30。相対的なばらつき（変動係数）が大きいのは？",c:["A","B","同じ","平均が違うので比較できない"],a:0,e:"変動係数 = 標準偏差/平均。A = 0.20、B = 0.15 なので A の方が相対的にばらつきが大きい。単位や水準が違うデータの比較に使う。"},
{f:"desc",q:"所得分布のように右に裾が長い分布で、一般に成り立つ大小関係は？",c:["平均 > 中央値 > 最頻値","最頻値 > 中央値 > 平均","平均 = 中央値 = 最頻値","中央値 > 平均 > 最頻値"],a:0,e:"右に裾が長いと、大きな値に平均が引っ張られる。山の位置(最頻値)が最も小さく、平均が最も大きくなる。"},
{f:"desc",q:"x と y の共分散が 12、x の標準偏差が 4、y の標準偏差が 5 のとき、相関係数は？",c:["0.6","0.24","2.4","0.75"],a:0,e:"r = 共分散 /(s<sub>x</sub>·s<sub>y</sub>) = 12/(4×5) = 0.6。"},
{f:"desc",q:"x と y の相関係数が 0.5 のとき、u = −2x + 3 と y の相関係数は？",c:["−0.5","0.5","−1.0","−0.25"],a:0,e:"一次変換 ax+b では相関係数の絶対値は変わらず、a<0 のとき符号だけ反転する。よって −0.5。"},
{f:"desc",q:"x̄=10、ȳ=20、s<sub>x</sub>=4、s<sub>y</sub>=5、相関係数 r=0.6 のとき、y の x への回帰直線は？",c:["ŷ = 12.5 + 0.75x","ŷ = 14 + 0.6x","ŷ = 12 + 0.8x","ŷ = 15 + 0.48x"],a:0,e:"傾き b = r·s<sub>y</sub>/s<sub>x</sub> = 0.6×5/4 = 0.75。回帰直線は (x̄, ȳ) を通るので切片 = 20 − 0.75×10 = 12.5。"},
{f:"desc",q:"単回帰で相関係数が r = −0.6 のとき、決定係数 R² は？",c:["0.36","−0.36","0.6","0.64"],a:0,e:"単回帰では R² = r²。符号は関係なく 0.36。y の変動の36%を x で説明できる。"},
{f:"desc",q:"売上が1年目に +20%、2年目に −10% 変化した。1年あたりの平均成長率は？",c:["約3.9%","5%","約4.2%","0%"],a:0,e:"成長率の平均は幾何平均。√(1.2×0.9) − 1 = √1.08 − 1 ≈ 0.039。算術平均の5%は誤り。"},
{f:"desc",q:"「アイスの売上が多い月ほど水難事故が多い」。この相関について最も適切な説明は？",c:["気温という第3の変数が両方に影響している（見かけの相関）","アイスを食べると事故が増える","事故が増えるとアイスが売れる","偶然なので意味はない"],a:0,e:"共通の要因(交絡因子)によって生じる相関は擬似相関・見かけ上の相関と呼ばれる。相関があっても因果関係とは限らない。"},
{f:"desc",q:"平均60・標準偏差8 のテストで 70点の標準化得点（z得点）は？",c:["1.25","0.8","10","1.5"],a:0,e:"z = (70−60)/8 = 1.25。偏差値に直すと 50 + 10×1.25 = 62.5。"},
// ---- データの収集 ----
{f:"coll",q:"母集団を性別や年代などのグループに分け、各グループから無作為に標本を抽出する方法は？",c:["層化抽出法","集落（クラスター）抽出法","系統抽出法","多段抽出法"],a:0,e:"層化抽出法は層内を均質、層間を異質に分けると精度が上がる。集落抽出は「グループごと丸ごと」選ぶ方法。"},
{f:"coll",q:"全国の学校から無作為に学校を選び、選ばれた学校の生徒全員を調査する方法は？",c:["集落（クラスター）抽出法","層化抽出法","系統抽出法","単純無作為抽出法"],a:0,e:"集団(クラスター)を単位に抽出し、その中は全数調査。調査コストは下がるが、クラスター内が似ていると精度は落ちやすい。"},
{f:"coll",q:"名簿から最初の1人を無作為に選び、以後10人おきに抽出する方法は？",c:["系統抽出法","層化抽出法","二段抽出法","有意抽出法"],a:0,e:"系統抽出(等間隔抽出)。名簿に周期性があると偏りが生じる点に注意。"},
{f:"coll",q:"フィッシャーの実験計画の3原則に含まれないものは？",c:["全数調査","反復","無作為化","局所管理"],a:0,e:"3原則は「反復・無作為化・局所管理(ブロック化)」。"},
{f:"coll",q:"新薬の臨床試験で、患者も医師もどちらの薬が投与されたか知らないようにする方法は？",c:["二重盲検法","単盲検法","クロスオーバー法","層化無作為化"],a:0,e:"二重盲検法は、患者側のプラセボ効果と医師側の評価の偏りの両方を防ぐ。"},
{f:"coll",q:"処理群と対照群への割り付けを無作為に行う主な目的は？",c:["未知の交絡要因の影響を両群で均等にするため","標本サイズを大きくするため","測定誤差をなくすため","検定の有意水準を下げるため"],a:0,e:"無作為化により、測定していない要因も確率的に両群へ均等に分かれ、処理の効果を偏りなく評価できる。"},
{f:"coll",q:"Webサイト上で「回答したい人だけ」が答えるアンケートで生じやすい偏りは？",c:["自己選択バイアス","測定バイアス","生存者バイアス","確証バイアス"],a:0,e:"関心の強い人ほど回答しやすく、標本が母集団を代表しなくなる(自己選択バイアス)。"},
// ---- 確率 ----
{f:"prob",q:"サイコロを2個投げて、出た目の和が7になる確率は？",c:["1/6","1/12","7/36","1/9"],a:0,e:"(1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通り。6/36 = 1/6。"},
{f:"prob",q:"ある病気の有病率は1%。検査は病気の人の90%を陽性と判定し、病気でない人の5%を誤って陽性と判定する。陽性の人が実際に病気である確率は？",c:["約15%","約90%","約50%","約5%"],a:0,e:"ベイズの定理。P(病気かつ陽性)=0.01×0.9=0.009、P(健康かつ陽性)=0.99×0.05=0.0495。0.009/(0.009+0.0495) ≈ 0.154。有病率が低いと陽性的中率は低くなる。"},
{f:"prob",q:"事象A, B は独立で P(A)=0.3、P(B)=0.4。P(A∪B) は？",c:["0.58","0.70","0.12","0.82"],a:0,e:"独立なので P(A∩B) = 0.3×0.4 = 0.12。P(A∪B) = 0.3 + 0.4 − 0.12 = 0.58。"},
{f:"prob",q:"コインを3回投げて、表が少なくとも1回出る確率は？",c:["7/8","3/8","1/2","3/4"],a:0,e:"余事象「3回とも裏」= (1/2)³ = 1/8。1 − 1/8 = 7/8。"},
{f:"prob",q:"P(A)>0、P(B)>0 で A と B が互いに排反のとき、正しいのは？",c:["A と B は独立ではない","A と B は必ず独立","P(A∩B) = P(A)P(B)","P(A∪B) = P(A)P(B)"],a:0,e:"排反なら P(A∩B)=0 だが P(A)P(B)>0 なので独立の条件を満たさない。「排反」と「独立」は別物。"},
{f:"prob",q:"P(A)=0.5、P(B)=0.4、P(A∩B)=0.2 のとき、P(A|B) は？",c:["0.5","0.4","0.2","0.8"],a:0,e:"P(A|B) = P(A∩B)/P(B) = 0.2/0.4 = 0.5。P(A) と等しいので A と B は独立。"},
// ---- 確率分布 ----
{f:"dist",q:"X が二項分布 B(10, 0.3) に従うとき、期待値と分散は？",c:["期待値3、分散2.1","期待値3、分散0.21","期待値0.3、分散2.1","期待値3、分散3"],a:0,e:"E[X] = np = 3、V[X] = np(1−p) = 10×0.3×0.7 = 2.1。"},
{f:"dist",q:"X が平均2のポアソン分布に従うとき、P(X=0) は？",c:["e⁻² ≈ 0.135","2e⁻² ≈ 0.271","0.5","1 − e⁻² ≈ 0.865"],a:0,e:"P(X=k) = λᵏe<sup>−λ</sup>/k!。k=0 なら e<sup>−λ</sup> = e⁻² ≈ 0.135。ポアソン分布は期待値=分散=λ。"},
{f:"dist",q:"E[X]=5、V[X]=4 のとき、Y = 3X − 2 の期待値と分散は？",c:["期待値13、分散36","期待値13、分散10","期待値15、分散12","期待値13、分散34"],a:0,e:"E[aX+b] = aE[X]+b = 13。V[aX+b] = a²V[X] = 9×4 = 36。定数 b は分散に影響しない。"},
{f:"dist",q:"X と Y は独立で V[X]=4、V[Y]=9。V[X − Y] は？",c:["13","5","−5","36"],a:0,e:"独立なら V[X−Y] = V[X] + (−1)²V[Y] = 13。引き算でも分散は足し算になる。"},
{f:"dist",q:"V[X]=4、V[Y]=9、V[X+Y]=19 のとき、X と Y の相関係数は？",c:["0.5","3","1/6","0.25"],a:0,e:"V[X+Y] = V[X]+V[Y]+2Cov → 19 = 13 + 2Cov → Cov = 3。相関係数 = 3/(2×3) = 0.5。"},
{f:"dist",q:"X ~ N(50, 10²) のとき、P(X > 70) は？（P(Z>2) ≈ 0.0228）",c:["約0.023","約0.046","約0.159","約0.977"],a:0,e:"標準化して Z = (70−50)/10 = 2。P(Z>2) ≈ 0.0228。"},
{f:"dist",q:"X ~ N(100, 15²) のとき、P(85 < X < 115) に最も近いのは？",c:["0.68","0.95","0.50","0.84"],a:0,e:"平均±1標準偏差の範囲なので約68.3%。±2σで約95.4%、±1.96σでちょうど95%。"},
{f:"dist",q:"待ち時間が平均5分の指数分布に従うとき、10分以上待つ確率は？",c:["e⁻² ≈ 0.135","e⁻⁵ ≈ 0.007","0.5","1 − e⁻² ≈ 0.865"],a:0,e:"平均 = 1/λ = 5 なので λ = 0.2。P(X>t) = e<sup>−λt</sup> = e<sup>−0.2×10</sup> = e⁻²。"},
{f:"dist",q:"サイコロを1の目が初めて出るまで投げ続けるとき、投げる回数の期待値は？",c:["6回","5回","3.5回","36回"],a:0,e:"成功確率 p の幾何分布(初成功までの回数)の期待値は 1/p = 6。"},
{f:"dist",q:"X が区間 [0, 12] の一様分布に従うとき、分散は？",c:["12","6","36","144"],a:0,e:"一様分布 U(a,b) の分散は (b−a)²/12 = 144/12 = 12。期待値は (a+b)/2 = 6。"},
{f:"dist",q:"指数分布の「無記憶性」の意味として正しいのは？",c:["すでに待った時間に関係なく、この先の待ち時間の分布は同じ","待つほど次の到着が早くなる","平均と分散が等しい","左右対称である"],a:0,e:"P(X > s+t | X > s) = P(X > t)。すでに s 待っていても、残りの待ち時間の分布は変わらない。"},
// ---- 標本分布 ----
{f:"samp",q:"母分散 σ² = 36 の母集団から大きさ n = 9 の標本をとる。標本平均の標準偏差（標準誤差）は？",c:["2","4","6","12"],a:0,e:"標本平均の分散 = σ²/n = 36/9 = 4、標準偏差 = 2。σ/√n で計算してもよい。"},
{f:"samp",q:"中心極限定理の内容として正しいのは？",c:["母集団の分布によらず、n が大きければ標本平均は近似的に正規分布に従う","母集団が正規分布なら、標本の値そのものも正規分布に近づく","n が大きくなると標本平均の分散は大きくなる","n が大きくなると母集団の分布が正規分布に近づく"],a:0,e:"標本平均 X̄ は近似的に N(μ, σ²/n)。母集団の分布の形は変わらない。"},
{f:"samp",q:"大きさ n=10 の標本で、母分散未知のまま母平均を推定するときに使う t 分布の自由度は？",c:["9","10","11","8"],a:0,e:"(X̄−μ)/(s/√n) は自由度 n−1 = 9 の t 分布に従う。"},
{f:"samp",q:"t 分布と標準正規分布の比較として正しいのは？",c:["t 分布は裾が重く、自由度が大きくなると標準正規分布に近づく","t 分布は左右非対称である","t 分布の方が裾が軽い","自由度が大きいほど t 分布の裾は重くなる"],a:0,e:"t 分布は0を中心に左右対称で、正規分布より裾が重い。自由度→∞で標準正規分布に一致する。"},
{f:"samp",q:"正規母集団 N(μ, σ²) からの大きさ n の標本の不偏分散 s² について、(n−1)s²/σ² が従う分布は？",c:["自由度 n−1 のカイ二乗分布","自由度 n のカイ二乗分布","自由度 n−1 の t 分布","標準正規分布"],a:0,e:"母分散の区間推定・検定で使う性質。μ を x̄ で推定するため自由度が1減る。"},
{f:"samp",q:"2つの正規母集団の分散が等しいかを調べるとき、検定統計量（不偏分散の比）が従う分布は？",c:["F 分布","t 分布","カイ二乗分布","二項分布"],a:0,e:"s₁²/s₂² は、等分散のもとで自由度 (n₁−1, n₂−1) の F 分布に従う。分散分析の F 検定も同じ分布。"},
// ---- 推定 ----
{f:"est",q:"標本分散を n−1 で割って計算する（不偏分散）理由は？",c:["その期待値が母分散と一致するから","値が小さくなるから","計算が簡単になるから","中心極限定理を使うため"],a:0,e:"n で割ると期待値が (n−1)σ²/n となり母分散を過小評価する。n−1 で割ると E[s²] = σ²(不偏推定量)。"},
{f:"est",q:"母標準偏差 σ = 10 が既知、n = 100、x̄ = 50 のとき、母平均の95%信頼区間は？",c:["[48.04, 51.96]","[49.02, 50.98]","[30.4, 69.6]","[48.0, 52.0] ちょうど"],a:0,e:"50 ± 1.96×10/√100 = 50 ± 1.96。"},
{f:"est",q:"母平均の95%信頼区間 [48, 52] の解釈として正しいのは？",c:["同じ方法で何度も区間を作ると、約95%の区間が母平均を含む","母平均が95%の確率で48〜52に入る","標本の95%が48〜52に入る","標本平均が95%の確率で48〜52に入る"],a:0,e:"母平均は定数で、ゆれるのは区間の方。作った区間のうち95%が真の値を含む、という手続きの信頼度。"},
{f:"est",q:"n = 400 の調査で支持率 p̂ = 0.2 だった。母比率の95%信頼区間は？",c:["約 [0.161, 0.239]","約 [0.180, 0.220]","約 [0.104, 0.296]","約 [0.190, 0.210]"],a:0,e:"標準誤差 = √(0.2×0.8/400) = 0.02。0.2 ± 1.96×0.02 = 0.2 ± 0.0392。"},
{f:"est",q:"他の条件を変えずに、信頼区間の幅を半分にするには標本サイズを何倍にする？",c:["4倍","2倍","√2倍","8倍"],a:0,e:"区間の幅は 1/√n に比例。幅を 1/2 にするには √n を2倍、つまり n を4倍。"},
{f:"est",q:"n = 16、x̄ = 20、不偏標準偏差 s = 4（母分散未知）のとき、母平均の95%信頼区間は？（t<sub>0.025</sub>(15) = 2.131）",c:["約 [17.87, 22.13]","約 [18.04, 21.96]","約 [11.48, 28.52]","約 [16.0, 24.0]"],a:0,e:"標準誤差 = 4/√16 = 1。20 ± 2.131×1。母分散未知なので z ではなく自由度15の t を使う。"},
{f:"est",q:"推定量の「一致性」の意味は？",c:["n を大きくすると推定量が真の値に確率的に近づく","推定量の期待値が真の値と等しい","推定量の分散が最小である","推定量が正規分布に従う"],a:0,e:"期待値が真の値と一致するのは「不偏性」、分散が最小なのは「有効性」。混同しやすい3つの性質。"},
// ---- 仮説検定 ----
{f:"test",q:"第1種の過誤とは？",c:["帰無仮説が正しいのに棄却してしまう誤り","帰無仮説が誤りなのに棄却しない誤り","対立仮説を棄却する誤り","標本の取り方を誤ること"],a:0,e:"第1種の過誤の確率 = 有意水準 α。第2種の過誤(確率β)は「誤った帰無仮説を棄却しない」こと。"},
{f:"test",q:"p 値の説明として正しいのは？",c:["帰無仮説が正しいとき、観測値以上に極端な結果が得られる確率","帰無仮説が正しい確率","対立仮説が正しい確率","第2種の過誤の確率"],a:0,e:"p 値は「H₀ のもとでの」確率であり、H₀ そのものが正しい確率ではない。p ≤ α で H₀ を棄却。"},
{f:"test",q:"H₀: μ = 50、σ = 10（既知）、n = 25、x̄ = 54。両側検定の結果は？",c:["z = 2.0 で5%有意だが1%有意ではない","z = 0.4 で有意でない","z = 2.0 で1%有意","z = 10 で1%有意"],a:0,e:"z = (54−50)/(10/√25) = 4/2 = 2.0。両側5%の棄却域 |z|>1.96 には入るが、両側1%の |z|>2.576 には入らない(p ≈ 0.046)。"},
{f:"test",q:"コインを100回投げて表が60回。H₀: p = 0.5 の検定統計量 z は？",c:["2.0","1.0","0.1","10"],a:0,e:"z = (0.6−0.5)/√(0.5×0.5/100) = 0.1/0.05 = 2.0。標準誤差は H₀ の値 p=0.5 で計算する。"},
{f:"test",q:"同じ被験者10人の、薬の投与前と投与後の血圧を比較する検定として最も適切なのは？",c:["対応のある t 検定","等分散を仮定した2標本 t 検定","ウェルチの t 検定","カイ二乗適合度検定"],a:0,e:"同じ人の前後なのでペアの差 d を取り、差の平均が0かを1標本 t 検定する(自由度 n−1 = 9)。"},
{f:"test",q:"標本サイズ10と12の2群で、等分散を仮定した2標本 t 検定を行う。自由度は？",c:["20","22","21","9と11"],a:0,e:"自由度 = n₁ + n₂ − 2 = 20。"},
{f:"test",q:"サイコロが公正かを、600回投げた各目の度数で検定する（適合度検定）。カイ二乗統計量の自由度は？",c:["5","6","599","1"],a:0,e:"カテゴリ数 6 − 1 = 5。推定したパラメータがあればさらにその数を引く。"},
{f:"test",q:"2行×3列の分割表で独立性の検定を行う。自由度は？",c:["2","6","5","3"],a:0,e:"(行数−1)×(列数−1) = 1×2 = 2。"},
{f:"test",q:"総数100の2×2分割表で、1行目の合計60、1列目の合計50。独立性の検定で(1行,1列)セルの期待度数は？",c:["30","25","50","60"],a:0,e:"期待度数 = 行合計×列合計/総数 = 60×50/100 = 30。"},
{f:"test",q:"検出力について正しいのは？",c:["他の条件が同じなら、標本サイズを大きくすると検出力は高まる","検出力 = 有意水準 α","検出力 = 第2種の過誤の確率 β","有意水準を小さくすると検出力は高まる"],a:0,e:"検出力 = 1 − β(誤った H₀ を正しく棄却する確率)。α を小さくすると β が大きくなり検出力は下がる。"},
{f:"test",q:"「新薬は従来薬より効果が大きい」ことを示したい。対立仮説の立て方として適切なのは？",c:["H₁: μ新 > μ旧（片側検定）","H₁: μ新 = μ旧","H₁: μ新 ≠ μ旧 のみが正しい","H₁: μ新 < μ旧"],a:0,e:"示したいことを対立仮説に置く。方向が明確なら片側検定。H₀ は「差がない(μ新 = μ旧)」。"},
// ---- 回帰分析 ----
{f:"reg",q:"回帰分析の出力で、ある説明変数の係数の推定値が 2.4、標準誤差が 0.8。t 値は？",c:["3.0","1.92","0.33","3.2"],a:0,e:"t 値 = 推定値/標準誤差 = 2.4/0.8 = 3.0。|t| がおよそ2を超えると5%で有意の目安。"},
{f:"reg",q:"残差平方和が 30、全平方和（y の偏差平方和）が 120 のとき、決定係数 R² は？",c:["0.75","0.25","0.5","4"],a:0,e:"R² = 1 − 残差平方和/全平方和 = 1 − 30/120 = 0.75。"},
{f:"reg",q:"切片を含む最小二乗法の回帰で、残差の合計は？",c:["必ず0になる","必ず正になる","決定係数に等しい","標本サイズに等しい"],a:0,e:"正規方程式から残差の和は0。また残差と説明変数の積の和も0になる。"},
{f:"reg",q:"重回帰分析で「自由度調整済み決定係数」を使う主な理由は？",c:["説明変数を増やすだけで R² が上がる問題を補正するため","R² を必ず1にするため","多重共線性をなくすため","残差を正規分布にするため"],a:0,e:"通常の R² は役に立たない変数を加えても下がらない。自由度で補正すると、変数の数が異なるモデルを比較しやすくなる。"},
{f:"reg",q:"重回帰分析で、説明変数どうしの相関が非常に強いときに起こりやすい問題は？",c:["多重共線性により係数の推定が不安定になる","決定係数が必ず0になる","残差の和が0にならない","t 値が必ず大きくなる"],a:0,e:"多重共線性があると係数の標準誤差が大きくなり、符号が直感と逆になることもある。"},
{f:"reg",q:"「血液型（A・B・O・AB）」を重回帰の説明変数にするとき、切片ありのモデルで必要なダミー変数の数は？",c:["3個","4個","2個","1個"],a:0,e:"カテゴリ数 − 1 = 3個。4個すべて入れると切片と完全な多重共線性が生じる。"},
{f:"reg",q:"回帰モデル ŷ = 3 + 2x で、x = 5 のとき実測値 y = 15。残差は？",c:["2","−2","13","0"],a:0,e:"予測値 ŷ = 3 + 10 = 13。残差 = 実測値 − 予測値 = 15 − 13 = 2。"},
// ---- 分散分析・時系列 ----
{f:"anova",q:"3群（各5人）の一元配置分散分析。群間と群内（残差）の自由度は？",c:["群間2、群内12","群間3、群内15","群間2、群内14","群間3、群内12"],a:0,e:"群間 = 群の数 − 1 = 2。群内 = 総数 − 群の数 = 15 − 3 = 12。合計は 総数 − 1 = 14。"},
{f:"anova",q:"一元配置分散分析で群間平方和40（自由度2）、群内平方和60（自由度12）。F 値は？",c:["4","0.67","2","6"],a:0,e:"平均平方は 群間 40/2 = 20、群内 60/12 = 5。F = 20/5 = 4。"},
{f:"anova",q:"一元配置分散分析の帰無仮説は？",c:["すべての群の母平均が等しい","すべての群の母分散が異なる","少なくとも1つの群の母平均が異なる","すべての群の標本平均が等しい"],a:0,e:"H₀: μ₁ = μ₂ = … = μ<sub>k</sub>。棄却されても「どの群が違うか」までは分からない(多重比較が必要)。"},
{f:"anova",q:"月次データから季節変動を取り除くのによく使う移動平均は？",c:["12か月移動平均（中心化）","3か月移動平均","前月比","前年同月比の累積"],a:0,e:"周期と同じ長さで平均すると季節成分が打ち消される。12は偶数なので中心化移動平均を使う。"},
{f:"anova",q:"ラスパイレス型の物価指数で、ウェイトとして使う数量は？",c:["基準時点の数量","比較時点の数量","両時点の平均","価格の逆数"],a:0,e:"ラスパイレス型は基準時点の数量で固定、パーシェ型は比較時点の数量を使う。消費者物価指数はラスパイレス型。"},

{f:"desc",q:"度数分布表から最頻値を求めるとき、ふつう用いる値は？",c:["度数が最大の階級の階級値","度数が最大の階級の度数","累積度数が0.5を超える階級の階級値","最も右の階級の階級値"],a:0,e:"最頻値は度数が最も多い階級の階級値(階級の真ん中の値)。累積相対度数0.5の階級は中央値を含む階級。"},
{f:"desc",q:"cm で測った身長データの「分散」の単位は？",c:["cm²","cm","単位なし","cm³"],a:0,e:"分散は偏差の2乗の平均なので単位も2乗になる。標準偏差は平方根をとるので元と同じ cm。"},
{f:"desc",q:"すべてのデータに 5 を加えると、平均と分散はどうなる？",c:["平均は5増え、分散は変わらない","平均も分散も5増える","平均は変わらず、分散は5増える","平均は5増え、分散は25増える"],a:0,e:"全体を平行移動しても散らばり具合は変わらない。分散・標準偏差・範囲・IQR は不変。"},
{f:"desc",q:"すべてのデータを 2 倍すると、標準偏差と分散はどうなる？",c:["標準偏差は2倍、分散は4倍","どちらも2倍","標準偏差は4倍、分散は2倍","どちらも変わらない"],a:0,e:"V[aX] = a²V[X] なので分散は4倍、標準偏差は |a| 倍で2倍。"},
{f:"desc",q:"相関係数が 0 に近いときの解釈として正しいのは？",c:["直線的な関係は弱いが、曲線的な関係がある可能性はある","2変数はまったく無関係である","2変数は独立である","散布図は必ず円形になる"],a:0,e:"相関係数は直線的関係の強さだけを測る。U字型のような強い非線形関係でも r ≈ 0 になりうる。"},
{f:"desc",q:"相関係数について正しいのは？",c:["外れ値が1つあるだけで大きく変わることがある","単位を cm から m に変えると値が変わる","必ず 0 以上 1 以下である","因果関係の向きを表す"],a:0,e:"相関係数は外れ値に敏感。単位変換(正の定数倍)では変わらず、範囲は −1〜1。"},
{f:"desc",q:"標準的な箱ひげ図（平均の印がないもの）から読み取れないものは？",c:["平均値","中央値","四分位範囲","分布の偏りの向き"],a:0,e:"箱ひげ図は最小・Q₁・中央値・Q₃・最大の5数要約を表す。平均値は表されない(×印で付記する流儀もある)。"},
{f:"desc",q:"「歪度が正」の分布の形は？",c:["右に裾が長い","左に裾が長い","左右対称","山が2つある"],a:0,e:"歪度 > 0 は右(大きい値の側)に裾が長い分布。このとき平均 > 中央値になりやすい。"},
{f:"desc",q:"ジニ係数について正しいのは？",c:["完全に平等な分布のとき 0 になる","完全に平等な分布のとき 1 になる","ローレンツ曲線が対角線から離れるほど 0 に近づく","負の値をとることが多い"],a:0,e:"ジニ係数は対角線(均等分布線)とローレンツ曲線で囲まれた面積の2倍。不平等なほど1に近づく。"},

{f:"desc",q:"「好きな果物」のような質的データを要約するグラフとして適切なのは？",c:["棒グラフ","ヒストグラム","散布図","箱ひげ図"],a:0,e:"カテゴリごとの度数は棒グラフや円・帯グラフで表す。ヒストグラムと箱ひげ図は量的データ、散布図は2つの量的変数用。"},
{f:"desc",q:"所得のように右に裾が長いデータに対して、分析しやすくするためによく行う変換は？",c:["対数変換","2乗する変換","符号を反転する変換","一定の値を加える変換"],a:0,e:"対数をとると大きな値が圧縮され、分布が左右対称に近づく。倍率で変化するデータにも向いている。"},
{f:"desc",q:"累積相対度数の最後の階級の値は？",c:["1","0","データの総数","最大値"],a:0,e:"相対度数をすべて足すと 1 (100%) になる。"},

{f:"coll",q:"全数調査の例として正しいものは？",c:["国勢調査","テレビの視聴率調査","内閣支持率の世論調査","工場製品の抜き取り検査"],a:0,e:"国勢調査は国内の全人口・全世帯が対象。ほかは一部を調べて全体を推測する標本調査。"},
{f:"coll",q:"標本サイズを大きくすることで小さくできる誤差は？",c:["標本誤差","回答者の記入ミス","質問文の誘導による偏り","調査対象の名簿の漏れ"],a:0,e:"標本誤差は「全員でなく一部を調べた」ことによる誤差で、n を増やすと小さくなる。他の3つは非標本誤差で、n を増やしても減らない。"},
{f:"coll",q:"観察研究と実験研究の最も本質的な違いは？",c:["研究者が処理（要因）を割り付けるかどうか","対象者の数が多いかどうか","統計的検定を行うかどうか","データが量的かどうか"],a:0,e:"実験研究では研究者が処理を割り付ける(無作為化できる)。観察研究では対象者が自然にとった行動を観察するだけなので交絡が残りやすい。"},
{f:"coll",q:"喫煙者と非喫煙者の集団を何年も追跡し、肺がんの発生率を比べる研究は？",c:["コホート研究","症例対照研究","横断研究","無作為化比較試験"],a:0,e:"要因(曝露)の有無で集団を分けて将来に向かって追跡するのがコホート研究(前向き研究)。"},
{f:"coll",q:"肺がん患者と肺がんでない人を集め、過去の喫煙歴を比べる研究は？",c:["症例対照研究","コホート研究","クロスオーバー試験","横断研究"],a:0,e:"結果(病気)の有無から出発して過去の要因を調べるのが症例対照研究(後ろ向き)。まれな病気の研究に向いている。"},
{f:"coll",q:"実験計画で「局所管理（ブロック化）」を行う目的は？",c:["条件の似た実験単位をまとめ、比較の精度を上げるため","標本サイズを減らすため","処理の割り付けを研究者が自由に決めるため","誤差を推定しないで済ませるため"],a:0,e:"ブロック内は条件が揃っているので、処理の差を見るときに余計なばらつきを取り除ける。"},
{f:"coll",q:"実験計画で「反復」を行う主な目的は？",c:["誤差の大きさを評価できるようにするため","交絡を完全になくすため","実験費用を下げるため","被験者に処理を知らせないため"],a:0,e:"同じ条件で繰り返し測定することで偶然誤差の大きさが分かり、処理効果が誤差より大きいか判断できる。"},
{f:"coll",q:"市町村を無作為に選び、選ばれた市町村の中からさらに個人を無作為に選ぶ方法は？",c:["二段（多段）抽出法","層化抽出法","集落抽出法","系統抽出法"],a:0,e:"抽出を段階的に行うのが多段抽出。2段目で中の全員を調べるなら集落抽出になる。"},
{f:"coll",q:"調査員が「典型的だと思う人」を選んで調査する方法の問題点は？",c:["偏りの大きさを確率的に評価できない","標本サイズが必ず小さくなる","費用が非常に高い","全数調査と同じになる"],a:0,e:"無作為でない有意抽出では、標本誤差を確率論で評価できず、推測の根拠がない。"},
{f:"coll",q:"臨床試験でプラセボ（偽薬）を対照群に与える目的は？",c:["「薬を飲んだ」という心理的効果と薬そのものの効果を分けるため","対照群の患者を治療するため","標本サイズを増やすため","副作用を測定しないため"],a:0,e:"プラセボ効果(思い込みによる改善)を両群で揃え、純粋な薬効だけを比較できるようにする。"},
{f:"coll",q:"郵送調査で回収率が低いときに特に心配される問題は？",c:["回答した人と回答しなかった人の性質が違う（無回答バイアス）","標本誤差がゼロになる","全数調査になってしまう","層化ができなくなる"],a:0,e:"回答する人は関心が高いなど特徴が偏りがち。回収率が低いほどこの偏りの影響が大きくなる。"},
{f:"coll",q:"「生き残った企業だけを分析すると成功の秘訣が見える気がする」ことの問題は？",c:["生存者バイアス","自己選択バイアス","測定バイアス","想起バイアス"],a:0,e:"脱落・失敗した対象がデータから消えているため、残った対象だけで結論を出すと偏る。"},
{f:"coll",q:"同じ被験者に処理Aと処理Bを時期を変えて両方行い、順番は無作為に決める試験は？",c:["クロスオーバー試験","並行群間比較試験","コホート研究","症例対照研究"],a:0,e:"個人差の影響を除けるので少人数でも精度が高い。前の処理の影響が残らないよう休薬期間(ウォッシュアウト)を置く。"},
{f:"coll",q:"過去の出来事を思い出して答えてもらう調査で生じやすい偏りは？",c:["想起バイアス","生存者バイアス","標本誤差","系統抽出の周期性"],a:0,e:"記憶の正確さが人によって違うために生じる偏り。症例対照研究で特に問題になる。"},
// ===== 追加分：確率 =====
{f:"prob",q:"乗法定理として正しいのは？",c:["P(A∩B) = P(A)·P(B|A)","P(A∩B) = P(A) + P(B)","P(A∩B) = P(A|B)·P(B|A)","P(A∩B) = P(A)/P(B)"],a:0,e:"条件付き確率の定義 P(B|A) = P(A∩B)/P(A) を変形したもの。独立なら P(B|A) = P(B)。"},
{f:"prob",q:"工場Aが製品の60%（不良率2%）、工場Bが40%（不良率5%）を作る。全体の不良率は？",c:["3.2%","3.5%","7%","2%"],a:0,e:"全確率の公式。0.6×0.02 + 0.4×0.05 = 0.012 + 0.020 = 0.032。"},
{f:"prob",q:"公正なコインで5回続けて裏が出た。6回目に表が出る確率は？",c:["1/2","1/64","31/32","1/32"],a:0,e:"各回は独立なので過去の結果に影響されない。「そろそろ表が出るはず」はギャンブラーの誤謬。"},
{f:"prob",q:"公正なサイコロ1個を投げたときの出る目の期待値は？",c:["3.5","3","6","21"],a:0,e:"(1+2+3+4+5+6)/6 = 21/6 = 3.5。期待値は実際に出る値である必要はない。"},
{f:"prob",q:"5人の中から代表2人を選ぶ方法は何通り？",c:["10通り","20通り","25通り","5通り"],a:0,e:"順番を区別しないので組合せ ₅C₂ = 5×4/2 = 10。委員長と副委員長のように区別するなら順列 ₅P₂ = 20。"},
{f:"prob",q:"P(A|B) と P(B|A) の関係について正しいのは？",c:["一般には等しくない","常に等しい","足すと必ず1になる","常に P(A|B) の方が大きい"],a:0,e:"P(A|B)=P(A∩B)/P(B)、P(B|A)=P(A∩B)/P(A)。P(A)=P(B) のときだけ等しい。検査の陽性的中率と感度の混同に注意。"},
{f:"prob",q:"事象Aの余事象 Aᶜ の確率は？",c:["1 − P(A)","P(A)","0","1/P(A)"],a:0,e:"「少なくとも1回」は余事象「1回も起きない」を使うと計算しやすい。"},
{f:"prob",q:"2つの事象が独立であることの定義は？",c:["P(A∩B) = P(A)P(B)","P(A∩B) = 0","P(A∪B) = 1","P(A) = P(B)"],a:0,e:"P(A∩B)=0 は「排反」の定義。独立と排反は別概念。"},
// ===== 追加分：確率分布 =====
{f:"dist",q:"二項分布 B(n, p) を正規分布で近似するときの目安として適切なのは？",c:["np と n(1−p) がともに十分大きい（5以上など）","n が 10 以下","p が 0 に非常に近い","np が 1 未満"],a:0,e:"このとき B(n,p) ≈ N(np, np(1−p))。n 大・p 小で np が一定程度ならポアソン近似が向いている。"},
{f:"dist",q:"二項分布 B(n, p) で n を大きく、p を小さくし、np = λ を一定に保ったときの極限の分布は？",c:["ポアソン分布","正規分布","指数分布","一様分布"],a:0,e:"「まれな事象の発生回数」がポアソン分布になる理由。事故件数、来客数などのモデル。"},
{f:"dist",q:"X ~ N(10, 3²)、Y ~ N(20, 4²) が独立のとき、X + Y の分布は？",c:["N(30, 5²)","N(30, 7²)","N(30, 12²)","N(15, 5²)"],a:0,e:"独立な正規分布の和も正規分布。平均 10+20 = 30、分散 9+16 = 25 なので標準偏差は 5。標準偏差を足して7にするのは誤り。"},
{f:"dist",q:"Z ~ N(0,1) で P(Z < 1.5) = 0.933 のとき、P(Z < −1.5) は？",c:["0.067","0.933","0.433","0.866"],a:0,e:"標準正規分布は0を中心に対称なので P(Z < −1.5) = 1 − P(Z < 1.5) = 0.067。"},
{f:"dist",q:"対数正規分布の説明として正しいのは？",c:["対数をとると正規分布に従う","負の値もとる","左右対称である","平均と分散が等しい"],a:0,e:"正の値だけをとり右に裾が長い。所得や粒子の大きさなどのモデルに使う。"},
{f:"dist",q:"赤玉と白玉の入った袋から、取り出した玉を戻さずに n 個取り出すときの赤玉の個数が従う分布は？",c:["超幾何分布","二項分布","ポアソン分布","幾何分布"],a:0,e:"非復元抽出では各回の確率が変わるので超幾何分布。戻す(復元抽出)なら二項分布。"},
{f:"dist",q:"連続型確率変数 X について、P(X = 3) の値は？",c:["0","確率密度関数の x=3 での値","1","計算できない"],a:0,e:"連続型では1点の確率は0。確率は区間の面積(積分)で表すので、P(X ≤ 3) と P(X < 3) は等しい。"},
{f:"dist",q:"確率密度関数のグラフと x 軸で囲まれた部分の面積の合計は？",c:["1","0","期待値","分散"],a:0,e:"全確率は1。密度関数の値そのものは1を超えることもある。"},
{f:"dist",q:"成功確率 p のベルヌーイ分布の分散 p(1−p) が最大になるのは？",c:["p = 0.5","p = 1","p = 0","p = 0.25"],a:0,e:"p(1−p) は p=0.5 で最大値 0.25。比率の推定で必要な標本サイズを見積もるとき、p 未知なら 0.5 を使う理由。"},
{f:"dist",q:"共分散が 0 のとき、2つの確率変数について言えることは？",c:["無相関だが、独立とは限らない","必ず独立である","必ず一方が定数である","必ず正規分布に従う"],a:0,e:"独立 ⇒ 無相関 は成り立つが、逆は一般に成り立たない(2変量正規分布なら例外的に成り立つ)。"},
{f:"dist",q:"E[X + Y] = E[X] + E[Y] が成り立つ条件は？",c:["X と Y が独立でなくても常に成り立つ","X と Y が独立のときだけ","X と Y が無相関のときだけ","X と Y が同じ分布のときだけ"],a:0,e:"期待値の線形性は常に成立。一方 V[X+Y] = V[X]+V[Y] は無相関(独立)のときだけ成立。"},
{f:"dist",q:"1時間あたり平均 λ 回起こるポアソン過程で、次の発生までの待ち時間が従う分布は？",c:["指数分布","ポアソン分布","正規分布","二項分布"],a:0,e:"「回数」はポアソン分布、「間隔(待ち時間)」は平均 1/λ の指数分布。"},
// ===== 追加分：標本分布 =====
{f:"samp",q:"標本平均 X̄ の期待値は？",c:["母平均 μ","μ/n","0","母分散 σ²"],a:0,e:"E[X̄] = μ。標本平均は母平均の不偏推定量。分散は σ²/n。"},
{f:"samp",q:"母集団が正規分布のとき、標本平均の分布について正しいのは？",c:["標本サイズによらず正規分布に従う","n ≥ 30 のときだけ正規分布に従う","t 分布に従う","カイ二乗分布に従う"],a:0,e:"正規分布に従う変数の和・平均は正確に正規分布。母集団が正規でない場合に、n が大きいと近似的に正規になるのが中心極限定理。"},
{f:"samp",q:"「標準偏差」と「標準誤差」の違いとして正しいのは？",c:["標準誤差は推定量（標本平均など）のばらつきを表す","標準誤差は個々のデータのばらつきを表す","両者は常に同じ値","標準誤差は n が大きいほど大きくなる"],a:0,e:"平均の標準誤差は σ/√n。データ自体の散らばりが標準偏差、推定値の精度が標準誤差。"},
{f:"samp",q:"カイ二乗分布の特徴として正しいのは？",c:["0以上の値だけをとり、右に裾が長い","左右対称である","負の値もとる","自由度によらず形が同じ"],a:0,e:"標準正規変数の2乗和なので非負。自由度が大きくなると対称に近づく。"},
{f:"samp",q:"自由度 k のカイ二乗分布の期待値は？",c:["k","k²","2k","1"],a:0,e:"期待値 k、分散 2k。"},
{f:"samp",q:"確率変数 T が自由度 ν の t 分布に従うとき、T² が従う分布は？",c:["自由度 (1, ν) の F 分布","自由度 ν のカイ二乗分布","標準正規分布","自由度 (ν, 1) の F 分布"],a:0,e:"t² = F(1, ν)。2群の比較で t 検定と一元配置分散分析が同じ結果になる理由。"},
{f:"samp",q:"標本比率 p̂（n 回中の成功の割合）の分散は？",c:["p(1−p)/n","np(1−p)","p(1−p)","p/n"],a:0,e:"成功回数 X の分散 np(1−p) を n² で割る。標準誤差は √(p(1−p)/n)。"},
{f:"samp",q:"「標本サイズを大きくすると標本平均が母平均に近づく」ことを示す定理は？",c:["大数の法則","中心極限定理","ベイズの定理","ガウス・マルコフの定理"],a:0,e:"大数の法則は「近づく」こと、中心極限定理は「分布の形が正規分布に近づく」こと。セットで覚える。"},
{f:"samp",q:"有限母集団（大きさ N）から非復元で n 個抽出するとき、標本平均の分散に掛ける修正項は？",c:["(N − n)/(N − 1)","n/N","(N − 1)/(N − n)","1/n"],a:0,e:"有限母集団修正。N が n に比べて十分大きければほぼ1なので無視できる。"},
{f:"samp",q:"F 分布に従う確率変数 F（自由度 m, n）の逆数 1/F が従う分布は？",c:["自由度 (n, m) の F 分布","自由度 (m, n) の F 分布","t 分布","カイ二乗分布"],a:0,e:"分子と分母が入れ替わるので自由度も入れ替わる。F 分布表の下側の値を求めるときに使う。"},
// ===== 追加分：推定 =====
{f:"est",q:"他の条件を変えずに信頼係数を95%から99%に上げると、信頼区間の幅は？",c:["広くなる","狭くなる","変わらない","半分になる"],a:0,e:"より確実に母数を含ませるには区間を広げる必要がある(1.96 → 2.576)。"},
{f:"est",q:"点推定と区間推定の違いとして正しいのは？",c:["区間推定は推定の精度（不確かさ）も同時に示す","点推定の方が常に正確","区間推定は標本を使わない","点推定は信頼係数を必要とする"],a:0,e:"点推定は1つの値、区間推定は幅を持った範囲で、どれくらい確かかも表す。"},
{f:"est",q:"最尤推定法の考え方として正しいのは？",c:["観測されたデータが得られる確率（尤度）を最大にするパラメータを推定値とする","残差平方和を最小にする","事前分布を必ず使う","標本の中央値を推定値とする"],a:0,e:"尤度関数(対数尤度)を微分して0となる値を求めるのが典型。正規分布の平均の最尤推定量は標本平均。"},
{f:"est",q:"正規母集団の母分散の信頼区間を作るときに用いる分布は？",c:["カイ二乗分布","t 分布","標準正規分布","F 分布"],a:0,e:"(n−1)s²/σ² ~ χ²(n−1) を使う。カイ二乗分布は非対称なので、区間も s² を中心に左右非対称になる。"},
{f:"est",q:"母比率がまったく分からないとき、必要な標本サイズを見積もるために使う p の値は？",c:["0.5","0","1","0.05"],a:0,e:"p(1−p) が最大になる p=0.5 を使うと、最も保守的(大きめ)な標本サイズになる。"},
{f:"est",q:"母分散が未知でも、標本サイズが非常に大きいとき平均の区間推定に標準正規分布を使ってよい理由は？",c:["自由度が大きい t 分布は標準正規分布とほぼ同じだから","母分散が0になるから","不偏分散が使えなくなるから","中心極限定理が成り立たなくなるから"],a:0,e:"自由度が大きいと t₀.₀₂₅ ≈ 1.96。小標本では t 分布を使わないと区間が狭すぎる。"},
{f:"est",q:"2つの母平均の差 μ₁ − μ₂ の95%信頼区間が [−1.2, 3.5] だった。正しい判断は？",c:["有意水準5%の両側検定で「差がない」は棄却されない","5%で有意な差がある","μ₁ > μ₂ が95%確実","1%で有意な差がある"],a:0,e:"区間が0を含むので、差=0という帰無仮説は5%両側検定で棄却されない。信頼区間と検定は表裏の関係。"},
{f:"est",q:"推定量の「有効性」とは？",c:["不偏推定量の中で分散が最も小さいこと","期待値が母数と一致すること","n→∞で母数に収束すること","正規分布に従うこと"],a:0,e:"不偏性(期待値が正しい)・一致性(大標本で近づく)・有効性(ばらつき最小)の区別を押さえる。"},
{f:"est",q:"標本平均の標準誤差を小さくする方法として正しいのは？",c:["標本サイズを大きくする","信頼係数を上げる","有意水準を下げる","不偏分散の代わりに標本分散を使う"],a:0,e:"標準誤差 σ/√n は n を増やすと小さくなる。信頼係数は区間の幅に影響するが標準誤差自体は変えない。"},
{f:"est",q:"母比率の95%信頼区間でよく使われる近似の前提は？",c:["n が大きく、二項分布を正規分布で近似できる","母集団が正規分布","p が必ず0.5","n が10以下"],a:0,e:"p̂ ± 1.96√(p̂(1−p̂)/n) は正規近似に基づく。np̂ や n(1−p̂) が小さいと精度が落ちる。"},

// ---------- ホーム ----------
function home(){
  let ka=0,kb=0,ga=0,gb=0;Object.values(S.st).forEach(v=>{ka+=v[0];kb+=v[1];});Object.values(S.dr).forEach(v=>{ga+=v[0];gb+=v[1];});
  let h=`<div class="card"><div class="meta"><span>知識 ${Q.length}問 ＋ 計算ドリル（無限）</span><span>正答率 ${pc(ka+ga,kb+gb)}</span></div><div class="bar"><i style="width:${kb+gb?(ka+ga)/(kb+gb)*100:0}%"></i></div>

  <div class="row"><button class="big sec" onclick="start(null,'k',10)">知識10問</button><button class="big sec" onclick="start(null,'g',10)">計算10問</button></div>
  <button class="big sec" onclick="startWrong()" ${S.wrong.length?"":"disabled"}>間違えた知識問題（${S.wrong.length}）</button></div>
  <p class="small" style="margin:12px 2px 8px">分野別に解く（％は正答率）</p>`;
  FIELDS.forEach(f=>{
    const qs=Q.filter(q=>q.f===f.id);let a=0,b=0;qs.forEach(q=>{const s=S.st[q.id];if(s){a+=s[0];b+=s[1];}});
    const d=S.dr[f.id]||[0,0];
    h+=`<div class="fbox"><div class="fname">${f.name}<small>${f.sub}</small></div><div class="row">
    <button class="fbtn" onclick="start('${f.id}','k')">知識 ${qs.length}問<b>${pc(a,b)}</b></button>
    <button class="fbtn" onclick="start('${f.id}','g',10)">計算ドリル<b>${pc(d[0],d[1])}</b></button></div></div>`;
  });
  h+=`<button class="link" onclick="resetAll()">成績をリセット</button><span id="rs" class="small"></span>`;
  $("home").innerHTML=h;
}
let confirmReset=false;
function resetAll(){
  if(!confirmReset){confirmReset=true;$("rs").textContent=" もう一度押すとリセットします";return;}
  S={st:{},wrong:[],dr:{}};save();confirmReset=false;home();
}

// ---------- 出題 ----------
let set=[],idx=0,correct=0,missed=[],last=null;
function start(fid,mode,n){
  last={fid,mode,n};
  if(mode==="k"){set=shuffle(fid?Q.filter(q=>q.f===fid):Q);if(n)set=set.slice(0,n);}
  else if(mode==="g"){set=Array.from({length:n||10},()=>genOne(fid));}
  else{const k=shuffle(Q).slice(0,Math.ceil((n||10)/2));const g=Array.from({length:(n||10)-k.length},()=>genOne(null));set=shuffle(k.concat(g));}
  run();
}
function startWrong(){last=null;set=shuffle(Q.filter(q=>S.wrong.includes(q.id)));run();}
function run(){idx=0;correct=0;missed=[];show("quiz");render();}
function render(){
  const q=set[idx],f=FIELDS.find(x=>x.id===q.f);
  const order=shuffle(q.c.map((t,i)=>i));
  let h=`<div class="meta"><span>${f.name}${q.gen?"・計算":""}</span><span>${idx+1} / ${set.length}</span></div><div class="bar"><i style="width:${idx/set.length*100}%"></i></div>
  <div class="card"><div class="qtext">${q.q}</div>`;
  order.forEach(i=>h+=`<button class="choice" data-i="${i}">${q.c[i]}</button>`);
  h+=`<div id="fb"></div></div><button class="link" onclick="show('home');home()">← やめてホームへ</button>`;
  $("quiz").innerHTML=h;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  window.scrollTo(0,0);
}
function answer(i){
  const q=set[idx],ok=i===q.a;
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;const k=+b.dataset.i;
    if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("ng");
  });
  if(q.gen){const d=S.dr[q.f]||[0,0];d[1]++;if(ok)d[0]++;S.dr[q.f]=d;if(!ok)missed.push(q);}
  else{
    const s=S.st[q.id]||[0,0];s[1]++;if(ok)s[0]++;S.st[q.id]=s;
    if(ok)S.wrong=S.wrong.filter(x=>x!==q.id);else{missed.push(q);if(!S.wrong.includes(q.id))S.wrong.push(q.id);}
  }
  if(ok)correct++;
  save();
  $("fb").innerHTML=`<div class="exp ${ok?"ok":"ng"}"><b class="v">${ok?"正解":"不正解"}</b>${q.e}</div>
  <button class="big" id="nx">${idx+1<set.length?"次の問題":"結果を見る"}</button>`;
  $("nx").onclick=()=>{idx++;idx<set.length?render():result();};
  $("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function result(){
  let h=`<div class="card"><p class="small" style="text-align:center;margin:0">結果</p><div class="score">${correct} / ${set.length}</div>
  <p style="text-align:center;margin:0 0 12px" class="small">正答率 ${Math.round(correct/set.length*100)}%</p>`;
  if(last&&last.mode!=="k")h+=`<button class="big" id="more">続けて10問</button>`;
  if(missed.length)h+=`<button class="big sec" id="rm">間違えた ${missed.length} 問をもう一度</button>`;
  h+=`<button class="big sec" onclick="show('home');home()">ホームへ</button></div>`;
  $("quiz").innerHTML=h;
  if(last&&last.mode!=="k")$("more").onclick=()=>start(last.fid,last.mode,10);
  if(missed.length)$("rm").onclick=()=>{set=shuffle(missed);run();};
  window.scrollTo(0,0);
}

// ---------- 画面切り替え ----------
function show(v){
  ["home","quiz","formula"].forEach(x=>$(x).classList.toggle("hide",x!==v));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===(v==="quiz"?"home":v)));
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{show(t.dataset.v);if(t.dataset.v==="home")home();});
